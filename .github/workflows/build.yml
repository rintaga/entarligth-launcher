name: Build Entarligth Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r23c + platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;23.2.8568313" "platforms;android-34" "build-tools;34.0.0"

      - name: Game files (client.jar, server.jar, libraries, asset index)
        run: python3 scripts/fetch_game.py

      - name: Fetch JRE runtime (32-bit)
        env:
          JRE_ARM_URL: ${{ vars.JRE_ARM_URL }}
        run: bash scripts/fetch_runtime.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        env:
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EntarligthLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
