plugins { id 'com.android.application' }

def msClientId = System.getenv('MS_CLIENT_ID') ?: ''

android {
    namespace 'com.entarligth.launcher'
    compileSdk 34
    ndkVersion '23.2.8568313' // NDK r23c

    defaultConfig {
        applicationId 'com.entarligth.launcher'
        minSdk 24
        targetSdk 28 // dlopen dari folder data app aman di target 28
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'armeabi-v7a' } // 32-bit saja
        buildConfigField "String", "MS_CLIENT_ID", "\"${msClientId}\""
    }

    buildFeatures { buildConfig true }

    externalNativeBuild {
        ndkBuild { path 'src/main/jni/Android.mk' }
    }

    androidResources { noCompress 'zip', 'jar', 'json' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}
